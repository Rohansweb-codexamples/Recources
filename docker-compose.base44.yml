services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rohans_resources
      POSTGRES_USER: rohan
      POSTGRES_PASSWORD: resources123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rohan -d rohans_resources"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  backend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: ["sh", "-ec", "apt-get update -qq && apt-get install -y -qq openssl > /dev/null 2>&1 && npm install && npx prisma generate && npx prisma db push && node prisma/seed.js && exec node --watch src/index.js"]
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://rohan:resources123@db:5432/rohans_resources
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
